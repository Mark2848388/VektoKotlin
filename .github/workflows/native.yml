name: Build Native APK
on:
  push:
    branches: [main]
    paths: ['native.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: unzip -q -o native.zip -d native
      - name: Build
        shell: bash
        working-directory: native
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          {
            echo '## Ошибки сборки (скопируйте и отправьте)'
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILED" -A2 build.log | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native/app/build/outputs/apk/debug/app-debug.apk Vektor.apk
          gh release create "v5-${{ github.run_number }}" Vektor.apk --title "Вектор 5.0 (сборка ${{ github.run_number }})" --notes "Нативная версия на Jetpack Compose" --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
